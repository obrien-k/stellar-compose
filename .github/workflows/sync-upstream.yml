name: Sync from upstream

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      # GITHUB_TOKEN can never push changes to .github/workflows/* (GitHub
      # blocks this unconditionally, regardless of `permissions:`, to stop a
      # workflow from escalating itself). Rebased upstream commits routinely
      # touch workflow YAML, so this job needs a PAT with the `workflow`
      # scope instead — set as the SYNC_PAT repo secret.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.SYNC_PAT }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/orphic-inc/stellar-compose.git

      - name: Sync main from upstream
        run: |
          git fetch upstream
          git rebase upstream/main
          git push origin main --force-with-lease
