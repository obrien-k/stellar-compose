# Fork-only: this file does not exist upstream, so nothing here ever collides
# with an upstream change during a sync. Keep it that way — fork-local CI
# config belongs in this file, never in a workflow upstream also owns.
#
# Upstream's own .github/workflows/sync-upstream.yml is kept byte-identical to
# upstream (so it merges cleanly) and is disabled in this fork's Actions
# settings; this workflow replaces it.
name: Sync fork from upstream

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      # Any push that creates or updates a file under .github/workflows/ needs a
      # token carrying the `workflow` scope. GITHUB_TOKEN is blocked from this
      # unconditionally — no `permissions:` value grants it — so the checkout
      # (and therefore the push) uses the SYNC_PAT secret instead.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.SYNC_PAT }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/orphic-inc/stellar-compose.git

      # Merge, not rebase. This fork permanently carries a local commit (this
      # file), so it can never be a clean fast-forward of upstream. A rebase
      # replays that local history over upstream on every run, which turns any
      # overlap into a conflict that recurs forever; a merge resolves the same
      # divergence once and stays resolved.
      - name: Merge upstream/main
        id: sync
        run: |
          set -euo pipefail
          git fetch upstream
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "Already contains upstream/main; nothing to do."
            echo "status=up-to-date" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git merge --no-edit upstream/main; then
            git push origin main
            echo "status=synced" >> "$GITHUB_OUTPUT"
          else
            git merge --abort
            echo "status=conflict" >> "$GITHUB_OUTPUT"
          fi

      # A conflict needs a human, so surface it once as a tracked issue rather
      # than as an unread red X every morning.
      - name: Report conflict
        if: steps.sync.outputs.status == 'conflict'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          gh label create sync-conflict --force --color B60205 \
            --description "Fork sync from upstream needs manual conflict resolution"
          existing=$(gh issue list --state open --label sync-conflict --limit 1 --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "Still conflicting on $(date -u +%Y-%m-%d). Run: $RUN_URL"
          else
            gh issue create --label sync-conflict \
              --title "Fork sync from upstream is blocked by a merge conflict" \
              --body "$(printf '%s\n' \
                "\`sync-fork.yml\` could not merge \`upstream/main\` into \`main\`." \
                "" \
                "Resolve locally:" \
                "" \
                '```' \
                "git fetch upstream" \
                "git merge upstream/main   # resolve, commit" \
                "git push origin main" \
                '```' \
                "" \
                "The merge was aborted, so \`main\` is untouched. This issue is updated, not duplicated, while the conflict persists." \
                "" \
                "Run: $RUN_URL")"
          fi
          exit 1
